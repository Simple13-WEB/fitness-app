name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Android
        run: npx cap sync android

      - name: Verify Android project
        run: |
          echo "=== Android project files ==="
          ls -la android/
          ls -la android/app/
          echo "=== gradle wrapper ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== variables ==="
          cat android/variables.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          # First just check gradle version
          ./gradlew --version || true
          echo "=== Now running assembleDebug ==="
          ./gradlew assembleDebug --stacktrace 2>&1
          echo "=== Exit code: $? ==="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fitness-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk